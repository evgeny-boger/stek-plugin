[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stek-plugin-python"
version = "2.7.0.9"
description = "Protocol-compatible Python reproduction of StekTrustPlugin"
requires-python = ">=3.9"
dependencies = ["cryptography>=42"]

[project.scripts]
stek-plugin = "stek_plugin.__main__:main"

[tool.setuptools.packages.find]
include = ["stek_plugin*"]
