name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "cryptography>=42"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write        # создание релиза и загрузка файлов
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools dpkg-dev
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Build wheel + sdist
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Collect artifacts
        run: |
          mkdir -p dist-out
          cp ../*.deb dist-out/
          cp dist/*.whl dist/*.tar.gz dist-out/ 2>/dev/null || true
          ls -l dist-out
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist-out/*
      # Релиз только с main и только если версии из debian/changelog ещё нет.
      - name: Release on changelog version bump
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(dpkg-parsechangelog -S Version)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG уже существует — пропускаю."
          else
            echo "Создаю релиз $TAG"
            gh release create "$TAG" dist-out/* \
              --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
